<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>जल्द आ रहा है</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --fg: #1f2937; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f3f4f6; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Noto Sans Devanagari", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0; font-size: 1.1rem; opacity: .8; }
</style>
</head>
<body>
  <main>
    <h1>यह पेज अभी तैयार हो रहा है</h1>
    <p>जल्द ही यहाँ जानकारी मिलेगी।</p>
  </main>
</body>
</html>
